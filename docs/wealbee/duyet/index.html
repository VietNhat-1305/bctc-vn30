<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Trang duyệt video</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#eef2f8;
font:16px/1.6 "Segoe UI",system-ui,sans-serif;text-align:center;padding:16px}.m{color:#a9b6cc;font-size:14px}</style>
</head><body><main><p id="tt">Đang mở trang duyệt video…</p>
<p class="m">Trang hỏi mật khẩu: xin người phụ trách luồng video.</p></main><script>
const dich = "https://belle-jobs-rocks-entertainment.trycloudflare.com/#cho_duyet";
const bao = t => document.getElementById('tt').innerHTML = t;
if (!dich.startsWith('https://')) bao('Trang duyệt đang tắt. Thử lại sau.');
else {
  const h = setTimeout(() => bao(tat), 8000);
  const tat = 'Trang duyệt đang tắt: máy chạy luồng chưa bật hoặc đường hầm đang khởi động lại.<br>Thử lại sau vài phút.';
  fetch(dich.split('/#')[0] + '/', {mode: 'no-cors', cache: 'no-store'})
    .then(() => { clearTimeout(h); location.replace(dich); })
    .catch(() => { clearTimeout(h); bao(tat); });
}
</script></body></html>
